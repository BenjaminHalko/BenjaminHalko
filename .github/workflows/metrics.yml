name: Metrics
# Community fork migration: https://github.com/EUR-UN/metrics-community/blob/main/MIGRATION.md
on:
  push:
    paths:
      - .github/workflows/metrics.yml
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
jobs:
  repositories:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: EUR-UN/metrics-community@af2cfde79cabc79fad8f3d2d1e88fe51bbde43c8 # v3.35.0-community.2
        with:
          filename: repositories.svg
          token: ${{ secrets.METRICS_TOKEN }}
          # Options
          user: BenjaminHalko
          template: classic
          base: repositories
          base_indepth: yes
          config_timezone: America/Vancouver
          plugin_traffic: yes
          plugin_lines: yes

  activity_community:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: EUR-UN/metrics-community@af2cfde79cabc79fad8f3d2d1e88fe51bbde43c8 # v3.35.0-community.2
        with:
          filename: activity_community.svg
          token: ${{ secrets.METRICS_TOKEN }}
          # Options
          user: BenjaminHalko
          template: classic
          base: activity, community
          base_indepth: yes
          config_timezone: America/Vancouver

  iso_calendar_followup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: EUR-UN/metrics-community@af2cfde79cabc79fad8f3d2d1e88fe51bbde43c8 # v3.35.0-community.2
        with:
          filename: iso_calendar_followup.svg
          token: ${{ secrets.METRICS_TOKEN }}
          # Options
          user: BenjaminHalko
          template: classic
          base: ""
          config_timezone: America/Vancouver
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_followup: yes
          plugin_followup_indepth: yes
          plugin_followup_sections: user

  habits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: EUR-UN/metrics-community@af2cfde79cabc79fad8f3d2d1e88fe51bbde43c8 # v3.35.0-community.2
        with:
          filename: habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          # Options
          user: BenjaminHalko
          template: classic
          base: ""
          config_timezone: America/Vancouver
          plugin_habits: yes
          plugin_habits_from: 500
          plugin_habits_days: 30
          plugin_habits_charts: yes
          plugin_habits_trim: yes

  achievements:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: EUR-UN/metrics-community@af2cfde79cabc79fad8f3d2d1e88fe51bbde43c8 # v3.35.0-community.2
        with:
          filename: achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          # Options
          user: BenjaminHalko
          template: classic
          base: ""
          config_timezone: America/Vancouver
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes

  achievements-indepth:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: EUR-UN/metrics-community@af2cfde79cabc79fad8f3d2d1e88fe51bbde43c8 # v3.35.0-community.2
        with:
          filename: achievements-indepth.svg
          token: ${{ secrets.METRICS_TOKEN }}
          # Options
          user: BenjaminHalko
          template: classic
          base: ""
          config_timezone: America/Vancouver
          plugin_achievements: yes
          plugin_achievements_threshold: X
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
